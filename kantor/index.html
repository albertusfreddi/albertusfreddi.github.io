<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<meta name="description" content="A four floor virtual office where an AI agent team works, hands over and reports in real time. Built and run by Albertus Freddi.">
<title>Virtual Office</title>
<meta name="theme-color" content="#F4ECDF">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2215%22%20fill=%22%23ffc93c%22/%3E%3CclipPath%20id=%22c%22%3E%3Cellipse%20cx=%2232%22%20cy=%2236%22%20rx=%2220%22%20ry=%2218%22/%3E%3C/clipPath%3E%3Cellipse%20cx=%2232%22%20cy=%2236%22%20rx=%2220%22%20ry=%2218%22%20fill=%22%23fff4cf%22/%3E%3Cg%20clip-path=%22url%28%23c%29%22%3E%3Cpath%20d=%22M10%2030h44M10%2042h44%22%20stroke=%22%232a2420%22%20stroke-width=%225%22/%3E%3C/g%3E%3Ccircle%20cx=%2225%22%20cy=%2234%22%20r=%223%22%20fill=%22%232a2420%22/%3E%3Ccircle%20cx=%2239%22%20cy=%2234%22%20r=%223%22%20fill=%22%232a2420%22/%3E%3C/svg%3E">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4ECDF;--card:#FFFDF9;--card-2:#F7F1E7;--line:#ECE3D4;--line-2:#DCCFBB;
  --ink:#2A2420;--ink-2:#55493F;--muted:#8A7C6E;
  --honey:#FFC93C;--honey-d:#E0A000;--honey-l:#FFF3CC;--coral:#E8654F;
  --ok:#3E9B63;--meet:#7A5BB0;--free:#9C9186;--off:#5F8FB8;
  --f:"Plus Jakarta Sans",-apple-system,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px;--sh:0 10px 30px -14px rgba(60,40,20,.28),0 1px 0 rgba(60,40,20,.04);
  color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--honey-d);outline-offset:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(220,207,187,.55)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn.soft{background:var(--card-2);border-color:transparent}
.btn.honey{background:var(--honey);border-color:var(--honey);color:var(--ink)}
.btn.honey:hover{background:#ffbf1f}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff8e6}
.btn[aria-pressed=true]{background:var(--honey-l);border-color:var(--honey)}
.btn.dark[aria-pressed=true]{background:var(--coral);border-color:var(--coral);color:#fff}
.btn svg{width:18px;height:18px;flex:none}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:rgba(42,36,32,.12);font-size:12px;font-weight:800}
.btn.honey .cnt{background:rgba(42,36,32,.16)}
.mono{font-family:var(--mono)}
.t{color:var(--muted);font-size:13px}

#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;display:flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;background:#fff;border:1px solid var(--line-2);box-shadow:0 3px 8px -4px rgba(0,0,0,.35);font:700 12px/1 var(--f);color:var(--ink);cursor:pointer;white-space:nowrap;will-change:transform}
.lbl i{width:8px;height:8px;border-radius:50%;background:var(--free)}
.lbl.kerja i{background:var(--ok)}.lbl.rapat i{background:var(--meet)}.lbl.off i{background:var(--off)}
.lbl.sel{background:var(--honey);border-color:var(--honey-d)}
.lbl.mgr{border-color:var(--honey-d);box-shadow:0 0 0 2px var(--honey-l),0 3px 8px -4px rgba(0,0,0,.35)}
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);max-width:220px;padding:6px 10px;border-radius:12px;background:#fff;border:2px solid var(--ink);font:600 12px/1.3 var(--f);color:var(--ink);box-shadow:0 3px 0 rgba(42,36,32,.15);pointer-events:none;will-change:transform}
.bub::after{content:"";position:absolute;left:18px;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
.bub.dots{font-size:18px;letter-spacing:2px;padding:0 12px;line-height:26px}
.bub.dots span{animation:dt 1.2s infinite}
.bub.dots span:nth-child(2){animation-delay:.2s}.bub.dots span:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,60%,100%{opacity:.25}30%{opacity:1}}

.brand{position:fixed;left:24px;top:20px;display:flex;align-items:center;gap:14px;padding:14px 20px 14px 14px}
.brand .lg{width:56px;height:56px;border-radius:14px;background:var(--honey);display:grid;place-items:center;flex:none}
.brand .lg svg{width:40px;height:40px}
.brand h1{margin:0;font-size:24px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.brand .s{color:var(--ink-2);font-size:14px;margin-top:2px}
.brand .tag{border-left:1px solid var(--line);padding-left:16px;margin-left:4px;color:var(--ink-2);font-size:13.5px;line-height:1.35;max-width:150px}

.floors{position:fixed;left:24px;top:132px;width:296px;padding:16px 14px 14px}
.floors h2,.log h2{margin:0;font-size:15px;font-weight:700}
.floors h2{color:var(--ink-2);font-weight:600;margin:0 6px 10px}
.fl{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:0;border-radius:14px;background:none;text-align:left;position:relative}
.fl:hover{background:var(--card-2)}
.fl[aria-current=true]{background:#FDECE2;box-shadow:inset 3px 0 0 var(--coral)}
.fl .th{position:relative;width:70px;height:50px;border-radius:10px;background:var(--card-2);flex:none;display:grid;place-items:center;overflow:visible}
.fl .th svg{width:62px;height:44px}
.fl .th b{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:#fff;border:1px solid var(--line-2);font-size:11.5px;display:grid;place-items:center}
.fl .k{font:500 11.5px var(--mono);color:var(--muted);letter-spacing:.04em}
.fl .n{font-weight:800;font-size:16.5px;line-height:1.15}
.fl .d{color:var(--ink-2);font-size:13px}
.whole{margin-top:10px;width:100%;justify-content:space-between;height:52px;border-radius:14px}

.topbar{position:fixed;right:24px;top:20px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;max-width:calc(100vw - 48px)}
.topbar label{color:var(--ink-2);font-size:13.5px;white-space:nowrap}
.topbar select{height:44px;min-width:180px;max-width:220px;border-radius:12px;border:1px solid var(--line-2);background:#fff;padding:0 12px}
.ava{display:flex;align-items:center;padding-left:6px;border-left:1px solid var(--line);margin-left:2px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 9.5px var(--f);letter-spacing:-.02em;border:2px solid #fff;margin-left:-8px;cursor:pointer}
.av.more{background:#EFE6D8;color:var(--ink-2)}

.log{position:fixed;right:24px;top:110px;bottom:120px;width:360px;display:flex;flex-direction:column;padding:18px 18px 0;overflow:hidden}
.log .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.log h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.live{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.off i{background:var(--coral)}
.stats{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin:14px 0 10px}
.stat{background:var(--card-2);border-radius:12px;padding:10px 12px;border:0;text-align:left}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2)}
.need{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;border:0;background:#FFF0CF;color:#8A5A00;font-weight:700;text-align:left;margin-bottom:6px}
.need .q{width:22px;height:22px;border-radius:50%;background:var(--honey);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.feed{flex:1;min-height:0;overflow:auto;margin:0 -18px;padding:0 18px 16px}
.row{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start;cursor:pointer}
.row:hover .tx{color:var(--ink)}
.row .tm{font:500 12.5px var(--mono);color:var(--muted);padding-top:3px}
.row .tx{color:var(--ink-2);font-size:14px;line-height:1.4}
.row .tx b{color:var(--ink);font-weight:700}
.chip{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:6px;color:#fff;font:800 10.5px var(--f);margin-right:6px;vertical-align:1px}
.row.amb .tx{color:var(--muted);font-size:13px}
.row.amb .chip{opacity:.65}
.row .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kosong{padding:24px 6px;color:var(--muted);text-align:center}

.controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.controls::-webkit-scrollbar{display:none}
.controls .sep{width:1px;height:28px;background:var(--line);flex:none}
.vol{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px;padding:0 6px}
.vol input{width:84px;accent-color:var(--coral)}

.person{position:fixed;left:24px;bottom:110px;width:340px;padding:16px;max-height:calc(100vh - 260px);overflow:auto}
.person .h{display:flex;gap:12px;align-items:center}
.person .pp{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font:800 16px var(--f);flex:none}
.person h3{margin:0;font-size:17px;line-height:1.2}
.person .x{margin-left:auto;align-self:flex-start;width:44px;height:44px;border:0;border-radius:12px;background:var(--card-2);font-size:18px}
.st{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--card-2)}
.st i{width:8px;height:8px;border-radius:50%;background:var(--free)}
.st.kerja i{background:var(--ok)}.st.rapat i{background:var(--meet)}.st.off i{background:var(--off)}
.task{margin:12px 0;padding:12px;border-radius:12px;background:var(--card-2);font-size:14px}
.task .t{display:block;margin-bottom:4px}
.hist{margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.person .acts{display:flex;gap:8px;margin-top:12px}
.suruh{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.suruh .btn{height:40px;padding:0 8px;justify-content:center;font-size:13px}
.suruh .btn.on{background:var(--honey);border-color:var(--honey-d)}
body.pindah #stage canvas{cursor:crosshair}
.person .acts .btn{flex:1;justify-content:center}

.sheet{position:fixed;inset:0;background:rgba(42,36,32,.28);display:flex;justify-content:flex-end;z-index:20}
.sheet .pn{width:min(560px,100vw);height:100%;background:var(--card);display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.sheet .ph{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.sheet .ph h2{margin:0;font-size:20px;font-weight:800;flex:1}
.tabs{display:flex;gap:6px;padding:12px 20px 4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;white-space:nowrap;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff8e6;border-color:var(--ink)}
.sb{flex:1;overflow:auto;padding:16px 20px 24px}
.kd{padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
.kd .tg{display:inline-block;font:800 10.5px var(--f);letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:var(--honey-l);color:#8A5A00;margin-bottom:6px}
.kd .tg.c{background:#FDE3DC;color:#A33A26}
.kd b{display:block;font-size:15px}
.kd .t{margin-top:3px}
.kd .acts{margin-top:10px}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kan h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.tk{padding:10px;border-radius:10px;background:var(--card-2);margin-bottom:8px;font-size:13px}
.tk small{display:block;color:var(--muted);margin-top:3px}
textarea.cmd{width:100%;min-height:120px;resize:vertical;border-radius:12px;border:1px solid var(--line-2);padding:12px;background:#fff;font:14px/1.5 var(--f)}
.cmdbar{display:flex;gap:10px;align-items:center;margin:10px 0 18px}
.ars-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted,#6b6254);margin:2px 0 6px}
.ars .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ars .acts a.btn{text-decoration:none;color:inherit}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--card-2)}
.pill.selesai{background:#DDF1E4;color:#1F6B3F}.pill.gagal{background:#FDE3DC;color:#A33A26}.pill.dikerjakan{background:var(--honey-l);color:#8A5A00}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--ink);color:#fff8e6;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;box-shadow:var(--sh)}

#login{position:fixed;inset:0;display:grid;place-items:center;padding:16px}
#login .card{width:min(380px,100%);padding:28px;display:flex;flex-direction:column;gap:10px}
#login .lg{width:64px;height:64px;border-radius:16px;background:var(--honey);display:grid;place-items:center}
#login h1{margin:6px 0 0;font-size:24px}
#login input{height:46px;border-radius:12px;border:1px solid var(--line-2);padding:0 14px;background:#fff}
#login label{font-weight:600;font-size:13px;margin-top:4px}
.err{color:#A33A26;font-size:13px;min-height:18px}

@media (max-width:1180px){.brand .tag{display:none}.log{width:320px}.topbar label{display:none}}
@media (max-width:900px){
  .brand{left:12px;top:12px;padding:8px 12px 8px 8px;gap:10px}.brand .lg{width:40px;height:40px;border-radius:11px}.brand .lg svg{width:28px;height:28px}.brand h1{font-size:17px}.brand .s{font-size:12px}
  .floors{left:12px;right:12px;top:auto;bottom:82px;width:auto;padding:8px;display:flex;gap:6px;overflow-x:auto}
  .floors{align-items:center}#flList{display:flex;gap:6px}
  .floors h2,.floors .fl .th,.floors .fl .d,.floors .fl .k{display:none}.fl{width:auto;flex:none;padding:0 12px;height:40px;border:1px solid var(--line)}.fl .n{font-size:13.5px;white-space:nowrap}.whole{margin:0;width:auto;height:40px;flex:none;padding:0 12px;font-size:13px}.whole>span:last-child{display:none}
  .brand .tag,.brand .s{display:none}
  .topbar{right:12px;top:72px;padding:6px;gap:6px}.topbar select,.ava,#bLife,#bOut{display:none}.topbar .btn{height:40px;padding:0 10px}
  .log{left:12px;right:12px;top:132px;bottom:150px;width:auto;z-index:5}
  .controls{bottom:12px;left:12px;right:12px;transform:none;max-width:none}
  .person{left:12px;right:12px;width:auto;bottom:150px;max-height:calc(100vh - 290px);z-index:6}
  .kan{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.bub.dots span{animation:none;opacity:.7}}
.t.lap{white-space:pre-line;line-height:1.55;margin-top:6px}
</style>
</head>
<body>
<div id="stage" aria-label="Kantor 3D Bittybe" role="img"></div>
<div id="labels"></div>

<div id="login" hidden></div>

<div id="app" hidden>
  <header class="brand card">
    <div class="lg"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M24 17q-3-8-9-9M40 17q3-8 9-9" fill="none" stroke="#2a2420" stroke-width="2.6" stroke-linecap="round"/><clipPath id="lg-b"><ellipse cx="32" cy="36" rx="20" ry="18"/></clipPath><ellipse cx="32" cy="36" rx="20" ry="18" fill="#fff4cf"/><g clip-path="url(#lg-b)"><path d="M8 29q24-6 48 0M8 44q24 6 48 0" fill="none" stroke="#2a2420" stroke-width="5"/></g><circle cx="25" cy="35" r="3.2" fill="#2a2420"/><circle cx="39" cy="35" r="3.2" fill="#2a2420"/></svg></div>
    <div><h1>Kantor Bittybe</h1><div class="s" id="brandSub">memuat…</div></div>
    <div class="tag">Kantor virtual untuk tim agen AI</div>
  </header>

  <nav class="floors card" aria-label="Bagian gedung">
    <h2>Bagian gedung</h2>
    <div id="flList"></div>
    <button class="btn dark whole" id="bWhole" type="button"><span style="display:flex;gap:10px;align-items:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 21V5l8-3v19M12 21h8V9l-8-3M8 8v.01M8 12v.01M8 16v.01M16 12v.01M16 16v.01"/></svg>Lihat seluruh gedung</span><span aria-hidden="true">›</span></button>
  </nav>

  <div class="topbar card">
    <label for="selP">Pegawai</label>
    <select id="selP" aria-label="Pilih pegawai"></select>
    <div class="ava" id="ava" aria-label="Pegawai yang sedang bekerja"></div>
    <button class="btn soft" id="bLog" type="button" aria-pressed="true">Log</button>
    <button class="btn honey" id="bTasks" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Tugas <span class="cnt" id="nTasks">0</span></button>
    <button class="btn" id="bCmd" type="button">Perintah</button>
    <button class="btn" id="bLife" type="button" aria-pressed="true" title="Tampilkan suasana kantor (simulasi) di log">Suasana</button>
    <button class="btn" id="bArsip" type="button" title="Cadangan semua artifact (dokumen dan halaman)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width:18px;height:18px"><path d="M3 7h18v4H3zM5 11v9h14v-9M10 15h4"/></svg>Arsip</button>
    
  </div>

  <aside class="log card" id="logPanel" aria-label="Log kantor">
    <div class="hd"><h2>Log kantor</h2><span class="live" id="live"><i></i><span id="liveT">menyambung…</span></span></div>
    <div class="stats">
      <button class="stat" type="button" data-f="kerja"><b id="sKerja">0</b><span>Bertugas</span></button>
      <button class="stat" type="button" data-f="free"><b id="sFree">0</b><span>Free</span></button>
      <button class="stat" type="button" data-f="selesai"><b id="sDone">0</b><span>Selesai hari ini</span></button>
    </div>
    <button class="need" id="need" type="button" hidden><span class="q">?</span><span id="needT"></span></button>
    <div class="feed" id="feed" role="log" aria-live="polite"></div>
  </aside>

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let turun = null;
renderer.domElement.addEventListener("pointerdown", (e) => (turun = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!turun || Math.hypot(e.clientX - turun[0], e.clientY - turun[1]) > 5) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  if (pindahMode && sel) {
    const h = ray.intersectObjects(slab.filter((m) => floorG[m.userData.slab].visible), false)[0];
    if (h) {
      const n = h.object.userData.slab, x = Math.max(-FX + 1, Math.min(FX - 1, h.point.x)), z = Math.max(-FZ + 1, Math.min(FZ - 1, h.point.z)), o = orang.get(sel);
      pindahMode = false; document.body.classList.remove("pindah");
      suruh(sel, "sini", { lantai: n, x, z, face: o ? Math.atan2(x - o.x, z - o.z) : 0, act: "berdiri di sini" });
      return;
    }
  }
  const hit = ray.intersectObjects([...orang.values()].filter((o) => o.root.visible).map((o) => o.root), true)[0];
  if (hit && hit.object.userData.pid) pilih(hit.object.userData.pid);
});

/* ---- musik lo-fi (WebAudio, dimulai dari tombol) ---- */
let ac = null, gain = null, musikOn = false, tMusik = 0;
function mulaiMusik() {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); gain = ac.createGain(); const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400; gain.connect(lp); lp.connect(ac.destination); }
  gain.gain.value = $("vol").value / 100 * 0.25;
  const AKOR = [[261.6, 329.6, 392, 493.9], [220, 261.6, 329.6, 392], [174.6, 220, 261.6, 329.6], [196, 246.9, 293.7, 349.2]];
  let i = 0; const bar = 2.8;
  const main = () => {
    if (!musikOn) return; const t0 = ac.currentTime + 0.05, ak = AKOR[i++ % 4];
    ak.forEach((f, j) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = j ? "triangle" : "sine"; o.frequency.value = j ? f : f / 2; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.16 / (j + 1), t0 + 0.4); g.gain.exponentialRampToValueAtTime(0.001, t0 + bar); o.connect(g); g.connect(gain); o.start(t0); o.stop(t0 + bar + 0.1); });
    for (let k = 0; k < 4; k++) { const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = ak[(k * 2 + i) % 4] * 2; const ts = t0 + k * bar / 4 + 0.35; g.gain.setValueAtTime(0, ts); g.gain.linearRampToValueAtTime(0.05, ts + 0.02); g.gain.exponentialRampToValueAtTime(0.001, ts + 0.6); o.connect(g); g.connect(gain); o.start(ts); o.stop(ts + 0.7); }
    tMusik = setTimeout(main, bar * 1000);
  };
  main();
}
$("bMusic").onclick = () => { musikOn = !musikOn; $("bMusic").setAttribute("aria-pressed", String(musikOn)); if (musikOn) { if (ac) ac.resume(); mulaiMusik(); } else { clearTimeout(tMusik); if (ac) ac.suspend(); } };
$("vol").oninput = () => { if (gain) gain.gain.value = $("vol").value / 100 * 0.25; };

/* ===================== data ===================== */
function setLive(st) { $("live").classList.toggle("off", st !== "live" && st !== "demo"); $("liveT").textContent = st === "live" ? "Live" : st === "demo" ? "Mode demo (data contoh)" : st === "poll" ? "Polling 10 dtk" : "Menyambung…"; }
function terapkanStaff(list, instan) {
  const lama = new Map([...staff].map(([k, v]) => [k, kunci(v) + "|" + v.task]));
  staff = new Map(list.map((p) => [p.id, p]));
  for (const [id, o] of orang) if (!staff.has(id)) { scene.remove(o.root); o.lbl.remove(); o.bub.remove(); orang.delete(id); }
  tetapkanMeja();
  for (const p of staff.values()) {
    const o = orang.get(p.id); const k = kunci(p) + "|" + p.task;
    if (instan || !lama.has(p.id)) rencanakan(p.id, true);
    else if (lama.get(p.id) !== k) {
      if (!(o && o.manual)) rencanakan(p.id, false); // perintah pemilik tetap berlaku; titik label tetap menunjukkan status asli
    }
    if (o && o.meja) { const tex = monitor.get(o.meja.id); if (tex) tulisLayar(tex, kode(p), kunci(p), tugasRamah(p.task) || (kunci(p) === "free" ? "Menunggu tugas berikutnya" : "")); }
  }
  renderHeader(); renderPerson();
}
function terapkanEvents(list, anim) {
  const baru = (list || []).filter((x) => !seenEv.has(evKey(x)));
  events = (list || []).slice(0, 80);
  baru.slice().reverse().forEach((x) => masukEvent(x, anim));
}
async function muatSemua(awal) {
  const [s, e, bd] = await Promise.all([sb.from("office_staff").select("*"), sb.from("office_events").select("*").order("ts", { ascending: false }).limit(60), sb.from("office_board").select("*").order("pos")]);
  if (s.error) { setLive("off"); return false; }
  if (!bd.error) board = bd.data || [];
  terapkanStaff(s.data || [], awal); terapkanEvents(e.data || [], !awal); tulisPapan(); renderHeader(); renderSheet();
  return true;
}
async function muatPerintah() { if (!sb) return; const r = await sb.from("office_perintah").select("id,teks,status,antrean_id,dibuat_pada").order("id", { ascending: false }).limit(12); if (!r.error) { perintah = r.data || []; renderSheet(); } }
let tStaff = 0, poll = null;
function langganan() {
  sb.channel("kantor3d")
    .on("postgres_changes", { event: "*", schema: "public", table: "office_staff" }, (pl) => {
      if (pl.eventType === "DELETE") { const id = pl.old && pl.old.id; if (id) staff.delete(id); }
      else if (pl.new && pl.new.id) staff.set(pl.new.id, { ...(staff.get(pl.new.id) || {}), ...pl.new });
      clearTimeout(tStaff); tStaff = setTimeout(() => terapkanStaff([...staff.values()], false), 80);
    })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "office_events" }, (pl) => { const e = pl.new; if (!e || seenEv.has(evKey(e))) return; events.unshift(e); events = events.slice(0, 80); masukEvent(e, true); renderHeader(); if (sel === e.actor) { riwayat.unshift(e); riwayat = riwayat.slice(0, 10); renderPerson(); } })
    .on("postgres_changes", { event: "*", schema: "public", table: "office_board" }, async () => { const bd = await sb.from("office_board").select("*").order("pos"); if (!bd.error) { board = bd.data || []; tulisPapan(); renderHeader(); renderSheet(); } })
    .on("postgres_changes", { event: "*", schema: "public", table: "office_perintah" }, (pl) => { if (pl.eventType === "INSERT") bicara(MGR, "✉ Perintah masuk", 4); muatPerintah(); })
    .subscribe((st) => { if (st === "SUBSCRIBED") { setLive("live"); clearInterval(poll); poll = null; } else if (["CHANNEL_ERROR", "TIMED_OUT", "CLOSED"].includes(st) && !poll) { setLive("poll"); poll = setInterval(() => { if (!document.hidden) muatSemua(false); }, 10000); } });
}

  const rows = daftar.map(([id, name, core]) => { const s = st(); return { id, name, core, unit: core ? "Inti · Kepala departemen" : "", status: s, task: s === "idle" || s === "off" ? null : TUGAS[hash(id) % TUGAS.length], updated_at: new Date(Date.now() - 60000).toISOString() }; });

    { id: 9, kind: "owner", tag: "KEPUTUSAN", title: "Aktifkan Doku untuk QRIS?", detail: "Butuh persetujuan pemilik sebelum kode pembayaran ditulis." },
    { id: 10, kind: "hasil", title: "Contoh laporan hasil", detail: "Ringkasan satu kalimat.\nApa yang dikerjakan: contoh.\nHasilnya: 10 dari 10 uji lulus.\nCara cek: buka Admin.\nYang perlu Anda lakukan: tidak ada." }];
  terapkanStaff(rows, true); tulisPapan(); renderHeader();
  let nid = 1;
  const ubah = () => {
    const ids = [...staff.keys()]; const p = { ...staff.get(ids[Math.floor(Math.random() * ids.length)]) };
    if (p.id === MGR || Math.random() < 0.25) {
      const t = staff.get(ids[1 + Math.floor(Math.random() * (ids.length - 1))]), tg = TUGAS[Math.floor(Math.random() * TUGAS.length)];
      const m = { ...staff.get(MGR), status: "coding", task: `Mendelegasikan ke ${t.id}: ${tg}`, updated_at: new Date().toISOString() }; staff.set(MGR, m);
      const e1 = { id: nid++, actor: MGR, status: "coding", task: m.task, ts: m.updated_at }; events.unshift(e1); masukEvent(e1, true);
      setTimeout(() => { const t2 = { ...staff.get(t.id), status: "coding", task: tg, updated_at: new Date().toISOString() }; staff.set(t.id, t2); terapkanStaff([...staff.values()], false); const e2 = { id: nid++, actor: t.id, status: "coding", task: tg, ts: t2.updated_at }; events.unshift(e2); masukEvent(e2, true); }, 5200);
    } else {

      const e = { id: nid++, actor: p.id, status: p.status, task: p.task, ts: p.updated_at }; events.unshift(e); masukEvent(e, true);
    }
    terapkanStaff([...staff.values()], false);
    setTimeout(ubah, 3500 + Math.random() * 3500);

  setTimeout(ubah, 1500);
}

/* ===================== mulai ===================== */
if (DEMO) window.__kb = { orang, staff, get viewFloor() { return viewFloor; } }; // hanya mode demo: untuk uji otomatis
lihatLantai(3); aturKamera(true); setLife(); requestAnimationFrame(loop);
const HP = matchMedia("(max-width: 900px)");
if (HP.matches) { $("logPanel").hidden = true; $("bLog").setAttribute("aria-pressed", "false"); }
async function mulai() {
  if (DEMO) { $("app").hidden = false; demo(); const q = new URLSearchParams(location.search); if (q.get("lantai")) lihatLantai(q.get("lantai") === "semua" ? "semua" : +q.get("lantai")); if (q.get("sel")) setTimeout(() => pilih(q.get("sel")), 600); if (q.get("tab")) setTimeout(() => bukaSheet(q.get("tab")), 600); return; }
  return;
  const { data } = await sb.auth.getSession();
  if (!data.session) { $("login").hidden = false; $("stage").style.filter = "blur(3px)"; return; }
  // MFA: akun dengan Google Authenticator wajib memasukkan kode dulu (basis data menolak data kantor tanpa aal2).
  if (await mintaMfa()) return;
  $("app").hidden = false;
  if (await muatSemua(true)) { langganan(); muatPerintah(); setInterval(() => { if (!document.hidden) muatSemua(false); }, 120000); }
  else { setLive("poll"); poll = setInterval(() => muatSemua(false), 10000); }
}
let faktorMfa = null;
async function mintaMfa() {
  const { data } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (!data || data.nextLevel !== "aal2" || data.currentLevel === "aal2") return false;
  const f = await sb.auth.mfa.listFactors(); faktorMfa = (f.data?.totp || []).find((x) => x.status === "verified");
  if (!faktorMfa) return false;
  $("login").hidden = false; $("stage").style.filter = "blur(3px)";
  for (const id of ["em", "pw", "go"]) { $(id).hidden = true; const l = document.querySelector(`label[for="${id}"]`); if (l) l.hidden = true; }
  $("mfaBox").hidden = false; $("kodeMfa").focus(); return true;
}
async function verifMfa() {
  const k = $("kodeMfa").value.replace(/\s+/g, ""); $("lerr").textContent = "";
  if (!/^\d{6}$/.test(k)) { $("lerr").textContent = "Masukkan 6 digit kode."; return; }
  const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: faktorMfa.id, code: k });
  if (error) { $("lerr").textContent = "Kode salah atau kedaluwarsa."; $("kodeMfa").value = ""; return; }
  location.reload();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { tulisPapan(); for (const p of staff.values()) { const o = orang.get(p.id); if (o && o.meja) tulisLayar(monitor.get(o.meja.id), kode(p), kunci(p), p.task || (kunci(p) === "free" ? "Menunggu tugas berikutnya" : "")); } });
mulai();
